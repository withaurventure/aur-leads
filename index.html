<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5D4B">
  <meta name="robots" content="noindex, nofollow">
  <title>AUR Leads</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- launch screen: shows instantly, before any script runs -->
  <div id="launch" class="launch" aria-hidden="true">
    <svg class="launch-mark" width="96" height="96" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0E6B57"/><path class="ring r2" d="M17 21A26 26 0 0 1 43 47" stroke="#fff" stroke-opacity=".45" stroke-width="5" fill="none" stroke-linecap="round"/><path class="ring r1" d="M17 31A16 16 0 0 1 33 47" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="18" cy="46" r="6" fill="#F2A33A"/></svg>
    <div class="launch-word">AUR <span>LEADS</span></div>
    <div class="launch-sub">Studio · Printing</div>
  </div>

  <div class="app">
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Main">
      <button class="tab" data-tab="home" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Home</span>
      </button>
      <button class="tab" data-tab="leads">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>Leads</span>
      </button>
      <button class="tab" data-tab="contacted">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12l2.2 2.2L15.5 9.5"/></svg><span>Contacted</span>
      </button>
      <button class="tab" data-tab="tenders">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg><span>Tenders</span>
      </button>
      <button class="tab" data-tab="review">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="12" r="3"/><path d="M9 6c4 0 6 2 6 6M9 18c4 0 6-2 6-6"/></svg><span>Review</span>
      </button>
    </nav>
  </div>

  <dialog id="confirm" class="sheet" aria-label="Confirm"></dialog>
  <div id="lock" class="lock" hidden></div>
  <div id="login" class="lock" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
